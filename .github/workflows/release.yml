name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Validate tag and repository metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$') { throw 'Invalid release tag' }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'ctxc').version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match Cargo workspace version' }
          if ((Get-Content -Raw Cargo.toml).Contains('YOUR_GITHUB_USER/')) { throw 'Run scripts/set-repository.ps1 before releasing' }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --all-features --locked
      - run: cargo test --workspace --locked
      - run: cargo build -p ctxc --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Path staging, artifacts | Out-Null
          $binary = if ($env:TARGET -like '*windows*') { 'ctxc.exe' } else { 'ctxc' }
          Copy-Item "target/$env:TARGET/release/$binary" staging/
          Copy-Item LICENSE, README.md staging/
          $name = "ctxc-$env:RELEASE_TAG-$env:TARGET"
          if ($IsWindows) { Compress-Archive -Path staging/* -DestinationPath "artifacts/$name.zip" }
          else { tar -czf "artifacts/$name.tar.gz" -C staging ctxc LICENSE README.md; if ($LASTEXITCODE) { throw 'tar failed' } }
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum ctxc-* > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --repo "$REPOSITORY" --verify-tag --generate-notes --title "Codex Context Optimizer $RELEASE_TAG"
